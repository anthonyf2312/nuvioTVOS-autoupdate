[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuvio-autoupdate"
version = "1.0.0"
description = "Keep a sideloaded Nuvio TV build in sync with its GitHub releases via atvloadly"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nuvio-updater = "nuvio_updater.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
