services:
  nuvio-autoupdate:
    build: .
    image: nuvio-autoupdate:latest
    container_name: nuvio-autoupdate
    restart: unless-stopped
    env_file: .env
    volumes:
      - nuvio-state:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  nuvio-state:
